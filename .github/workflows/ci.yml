name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libjpeg-dev clang-format
      - name: Configure
        run: cmake --preset debug-native
      - name: Build
        run: cmake --build build/debug --parallel
      - name: Test
        run: ctest --test-dir build/debug --output-on-failure
      - name: Check formatting
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

  release-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libjpeg-dev
      - name: Configure
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCPPPDF_BUILD_EXAMPLES=OFF
      - name: Build library
        run: cmake --build build/release --target cpppdf --parallel
      - name: Verify install
        run: cmake --install build/release --prefix build/install
