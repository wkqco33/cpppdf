name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux_amd64
          - os: macos-latest
            name: darwin_arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libjpeg-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja jpeg-turbo
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Configure and build
        run: |
          cmake -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DBUILD_TESTING=OFF \
            -DCPPPDF_BUILD_EXAMPLES=OFF \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"
          cmake --build build/release --target cpppdf

      - name: Package
        run: |
          cmake --install build/release --prefix package
          tar czf cpppdf_${{ matrix.name }}.tar.gz -C package .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cpppdf_${{ matrix.name }}.tar.gz
